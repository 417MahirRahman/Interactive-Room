<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Lightkeeper's Fairy</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="scene-canvas"></canvas>

  <!-- INTRO OVERLAY -->
  <div id="intro">
    <div class="intro-panel">
      <p class="eyebrow">A TAME MAGIC</p>
      <h1>THE LIGHTKEEPER'S<br/>FAIRY</h1>
      <p class="sub">Move your hand to carry the light. A guardian spirit of the forest will drift toward it, curious.<br/>
      Click to snuff the light out — she'll dance off through the ruins on her own until you call her back.</p>
      <button id="enter-btn">✦ ENTER THE NIGHT</button>
    </div>
  </div>

  <!-- STATE HUD -->
  <div id="hud">
    <div class="hud-row"><span class="hud-label">LIGHT</span><span id="hud-light">ON</span></div>
    <div class="hud-row"><span class="hud-label">FAIRY</span><span id="hud-state">FOLLOWING</span></div>
  </div>

  <!-- CONTROLS -->
  <div id="controls-panel">
    <div class="control-row">
      <label for="fairy-count">FAIRIES <span id="fairy-count-value">1</span></label>
      <input type="range" id="fairy-count" min="1" max="10" step="1" value="1" />
    </div>
    <div class="control-row">
      <label for="fairy-speed">SPEED <span id="fairy-speed-value">1.0×</span></label>
      <input type="range" id="fairy-speed" min="0.3" max="2.5" step="0.1" value="1" />
    </div>
  </div>

  <button id="sound-toggle" title="Toggle ambience" aria-label="Toggle sound">🔊</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
